{% extends 'base.html' %}

{% block title %}Оставить отзыв — Flowerly{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">Отзыв на букет «{{ bouquet.name }}»</h5>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        {% if bouquet.image %}
                        <img src="{{ bouquet.image.url }}" class="rounded" style="width: 150px; height: 150px; object-fit: cover;">
                        {% else %}
                        <div class="bg-light rounded d-flex align-items-center justify-content-center mx-auto" 
                             style="width: 150px; height: 150px;">
                            <i class="bi bi-flower1 text-muted display-4"></i>
                        </div>
                        {% endif %}
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4 text-center">
                            <label class="form-label fw-bold">Ваша оценка</label>
                            <div class="star-rating">
                                <input type="radio" id="star5" name="rating" value="5">
                                <label for="star5"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star4" name="rating" value="4">
                                <label for="star4"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star3" name="rating" value="3">
                                <label for="star3"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star2" name="rating" value="2">
                                <label for="star2"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star1" name="rating" value="1">
                                <label for="star1"><i class="bi bi-star-fill"></i></label>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Ваш отзыв</label>
                            {{ form.text }}
                        </div>
                        
                        <button type="submit" class="btn btn-danger w-100">
                            <i class="bi bi-check-lg"></i> Отправить отзыв
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
